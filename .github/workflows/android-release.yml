name: android-release

# 打 tag 即发版：构建 -> 发布前门禁（tools/preflight.sh）-> 产物与 SHA256SUMS 挂到 Release。
# 发布说明放在 docs/release-notes/<version>.md，缺失时拒绝发版（第 5 章清单第 20 项）。
# 需要的仓库 Secrets：
#   KEYSTORE_BASE64  发布 keystore 的 base64（.signing/zippest-release.jks）
#   STORE_PASSWORD   keystore 口令
#   KEY_ALIAS        密钥别名
#   KEY_PASSWORD     密钥口令
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # versionCode 单调校验需要读取上一个 tag 的构建文件

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少 KEYSTORE_BASE64，拒绝发布未签名产物" >&2
            exit 1
          fi
          mkdir -p .signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > .signing/zippest-release.jks
          cat > .signing/zippest-release.properties <<EOF
          storeFile=zippest-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Verify version matches tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag=$TAG 与 versionName=$VERSION 不一致" >&2
            exit 1
          fi
          echo "版本校验通过：$VERSION"

      - name: Verify version code is monotonic
        run: |
          set -euo pipefail
          CUR=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' android/app/build.gradle.kts)
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            echo "没有更早的 tag，跳过 versionCode 比较"
            exit 0
          fi
          PREV=$(git show "$PREV_TAG:android/app/build.gradle.kts" | grep -oP 'versionCode\s*=\s*\K[0-9]+')
          if [ "$CUR" -le "$PREV" ]; then
            echo "versionCode $CUR 未大于 $PREV_TAG 的 $PREV" >&2
            exit 1
          fi
          echo "versionCode 校验通过：$PREV_TAG=$PREV -> $CUR"

      # AGP 不允许 ABI 拆分与 AAB 同时构建：先出分 ABI 的 APK，再用 -PzippestBundle 出 AAB。
      - name: Build APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            lintDebug testDebugUnitTest assembleRelease

      - name: Build bundle
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace -PzippestBundle bundleRelease

      # 与本地 tools/preflight.sh 同一份检查：ABI、16 KB 对齐、签名、权限清单、
      # 网络调用面。CI 只跳过联网链接检查（发布说明的链接在发版后由人复核）。
      # 失败时把报告推到 ci-preflight 分支，公开仓库不用登录也能 `git fetch` 读。
      - name: Preflight checks
        run: |
          set +e
          bash -x tools/preflight.sh --skip-build --no-links --report preflight-report.txt > preflight.log 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B ci-preflight
            git add -f preflight-report.txt preflight.log
            git commit -m "ci: preflight report for ${GITHUB_REF_NAME}"
            git push -f origin ci-preflight || true
          fi
          exit "$STATUS"

      - name: Collect artifacts and checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk "dist/Zippest-${VERSION}-arm64-v8a.apk"
          cp android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk "dist/Zippest-${VERSION}-armeabi-v7a.apk"
          cp android/app/build/outputs/apk/release/app-universal-release.apk "dist/Zippest-${VERSION}-universal.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/Zippest-${VERSION}.aab"
          cd dist
          sha256sum * > "SHA256SUMS-${VERSION}.txt"
          cat "SHA256SUMS-${VERSION}.txt"

      - name: Verify release notes exist
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="docs/release-notes/${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            echo "缺少发布说明 $NOTES：按第 5 章清单第 20 项，发版必须有面向用户的说明" >&2
            exit 1
          fi
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"
          echo "发布说明：$NOTES"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.aab
            dist/SHA256SUMS-*.txt
          body_path: ${{ env.NOTES }}
          fail_on_unmatched_files: true

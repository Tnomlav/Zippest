      function icon(id) { return '<svg class="icon" aria-hidden="true"><use href="#' + id + '"/></svg>'; }

        return String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
      }
      function formatBytes(bytes) {
        if (!bytes) return "0 KB";
        if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(1) + " GB";
        if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + " MB";
        if (bytes >= 1024) return Math.round(bytes / 1024) + " KB";
        return bytes + " B";
      }
      function formatDate(stamp) {

      function showToast(message) {

      function folderItemCount(dirId) { return (dirs[dirId] && dirs[dirId].entries.length) || 0; }
      function currentDirId() { return state.dirPath[state.dirPath.length - 1]; }
      function currentArchive() { return state.archiveKey ? archiveData[state.archiveKey] : null; }
      function currentArchiveFolderKey() { return state.archivePath.join("/"); }
      function currentArchiveFolderName() {
        if (!state.archivePath.length) return currentArchive().name;
        return state.archivePath[state.archivePath.length - 1];
      }

      function currentEntries() {
        if (state.mode === "archive") {
          const archive = currentArchive();
          return (archive.folders[currentArchiveFolderKey()] || []).slice();
        }
        return (dirs[currentDirId()].entries || []).map((id) => entries[id]).filter(Boolean);
      }

      function visibleEntries() {
        const query = state.query.trim().toLocaleLowerCase("zh-CN");
        const list = currentEntries().filter((entry) => !query || entry.name.toLocaleLowerCase("zh-CN").includes(query));
        return list.sort((a, b) => {
          const folderA = a.kind === "folder" ? 0 : 1;
          const folderB = b.kind === "folder" ? 0 : 1;
          if (folderA !== folderB) return folderA - folderB;
          let valueA;
          let valueB;
          if (state.sortKey === "size") {
            valueA = a.kind === "folder" ? (a.itemCount || 0) : (a.sizeBytes || 0);
            valueB = b.kind === "folder" ? (b.itemCount || 0) : (b.sizeBytes || 0);
          } else if (state.sortKey === "date") {
            valueA = a.modified || 0;
            valueB = b.modified || 0;
          } else {
            valueA = a.name.toLocaleLowerCase("zh-CN");
            valueB = b.name.toLocaleLowerCase("zh-CN");
          }
          if (typeof valueA === "string") return valueA.localeCompare(valueB, "zh-CN") * state.sortDirection;
          return (valueA - valueB) * state.sortDirection;
        });
      }

      function fileIcon(entry) {
        if (entry.kind === "folder") return "i-folder";
        if (entry.kind === "archive") return "i-archive";
        const ext = (entry.ext || "").toLowerCase();
        if (["jpg", "jpeg", "png", "webp", "gif", "svg"].includes(ext)) return "i-image";
        if (["mp4", "mov", "mkv", "webm"].includes(ext)) return "i-video";
        if (["txt", "md", "json", "xml", "pdf"].includes(ext)) return "i-text";

      function renderBreadcrumb() {
        const segments = [];

            escapeHTML(segment.label) + '</button>' +

        }).join("");
        requestAnimationFrame(() => { breadcrumb.scrollLeft = breadcrumb.scrollWidth; });

      function renderFileList() {
        const list = visibleEntries();

          const selected = state.selected.has(entry.id);
          let meta;
          if (entry.kind === "folder") {
            meta = (entry.itemCount || folderItemCount(entry.childDir)) + " 项 · " + formatDate(entry.modified);
          } else {
            meta = formatBytes(entry.sizeBytes) + " · " + formatDate(entry.modified);
          }
          if (entry.encrypted) meta += ' · <span class="encrypted">已加密</span>';
          return '<div class="file-row ' + (selected ? "selected " : "") + '" role="button" tabindex="0" data-m3="ListItem" aria-pressed="' + selected + '" data-row-id="' + entry.id + '" aria-label="' + escapeHTML((entry.kind === "folder" ? "打开文件夹 " : entry.kind === "archive" ? "打开压缩包 " : "查看 ") + entry.name) + '">' +
            (state.mode === "files" ? '<button class="check-button" type="button" data-check-id="' + entry.id + '" aria-label="选择 ' + escapeHTML(entry.name) + '" aria-pressed="' + selected + '"><span class="checkbox">' + icon("i-check") + '</span></button>' : "") +
            '<span class="file-icon ' + entry.kind + '">' + icon(fileIcon(entry)) + '</span>' +
            '<span class="file-copy"><span class="file-name-line"><span class="file-name">' + escapeHTML(entry.name) + '</span>' +
            (entry.kind === "archive" ? '<span class="file-type">' + escapeHTML(entry.format || "") + '</span>' : "") +
            '</span><span class="file-meta">' + meta + '</span></span>' +
            (entry.kind === "folder" || entry.kind === "archive" ? '<svg class="icon row-chevron"><use href="#i-chevron"/></svg>' : "") +
            '</div>';
        }).join("");
        const noResults = list.length === 0;
        emptyState.hidden = !noResults;
        fileScroll.hidden = noResults;
        if (noResults) {
          const searching = Boolean(state.query.trim());

          document.getElementById("emptyDescription").textContent = searching ? "换个关键词，或清除搜索后重试。" : "新建文件夹或压缩包后会显示在这里。";
          document.getElementById("emptyAction").textContent = searching ? "清除搜索" : "新建文件夹";
        }
        renderTopbar();

      function renderToolbars() {
        const hasSelection = state.selectionMode;

      function renderAll() {

      function clearSelection() {
        state.selectionMode = false;

      function enterSelection(id) {
        if (state.mode !== "files") {

        renderFileList();
        renderToolbars();
      }
      function toggleSelection(id) {
        if (state.mode !== "files") return;
        if (!state.selectionMode) state.selectionMode = true;

        else state.selected.add(id);

        renderFileList();
        renderToolbars();
      }

      function activateEntry(entry) {
        if (!entry) return;
        if (state.selectionMode) {
          toggleSelection(entry.id);
          return;
        }
        if (entry.kind === "folder") {
          clearSelection();
          if (state.mode === "archive") {
            if (!entry.folderKey) {
              showToast("此文件夹没有可浏览的内容");
              return;
            }
            state.archivePath.push(entry.folderKey);
          } else {
            state.dirPath.push(entry.childDir);
          }
          state.searchMode = false;
          state.query = "";

          fileScroll.scrollTop = 0;

        if (entry.kind === "archive") {

        openInfo("文件信息", [

          ["修改日期", new Date(entry.modified).toLocaleString("zh-CN", { hour12: false })],
          ["位置", state.dirPath.map((id) => dirs[id].name).join(" / ")]
        ], "文件");
      }

      function openArchive(entry) {
        if (!entry.archiveKey) return;
        if (!archiveData[entry.archiveKey]) {
          archiveData[entry.archiveKey] = buildFallbackArchive(entry.name, entry.sizeBytes, entry.format);
        }
        clearSelection();
        state.mode = "archive";
        state.archiveKey = entry.archiveKey;
        state.archivePath = [];
        state.searchMode = false;
        state.query = "";
        searchInput.value = "";
        renderAll();
        fileScroll.scrollTop = 0;
      }

      function goBack() {
        if (state.mode === "archive") {
          if (state.archivePath.length) {
            state.archivePath.pop();

          } else {
            state.mode = "files";
            state.archiveKey = null;
            renderAll();
            fileScroll.scrollTop = 0;
          }
          return;
        }
        if (state.selectionMode) {
          clearSelection();
          renderAll();
          return;
        }
        if (state.searchMode) {
          closeSearch();
          return;
        }
        if (state.dirPath.length > 1) {
          state.dirPath.pop();
          renderAll();
          fileScroll.scrollTop = 0;
        }
      }

      function closeSearch() {

      function renderSortMenuState() {
        document.querySelectorAll("[data-sort-key]").forEach((button) => {

          if (check) check.innerHTML = active ? icon("i-check") : "";

        document.getElementById("sortDirectionLabel").textContent = state.sortDirection === 1 ? "升序" : "降序";
      }

      // Long press and row interactions
      let pressTimer = 0;
      let pressStart = null;
      let pressRow = null;
      fileList.addEventListener("pointerdown", (event) => {
        const row = event.target.closest("[data-row-id]");
        if (!row || event.button > 0 || event.target.closest("[data-check-id]") || state.mode !== "files") return;
        pressStart = { x: event.clientX, y: event.clientY };
        pressRow = row;
        row.classList.add("pressing");
        clearTimeout(pressTimer);
        pressTimer = setTimeout(() => {
          const id = row.dataset.rowId;
          state.suppressClick = id;
          if (!state.selectionMode) enterSelection(id);
          else toggleSelection(id);
          setTimeout(() => {
            if (state.suppressClick === id) state.suppressClick = null;
          }, 900);
        }, 470);
      });
      fileList.addEventListener("pointermove", (event) => {
        if (!pressStart) return;
        if (Math.abs(event.clientX - pressStart.x) > 9 || Math.abs(event.clientY - pressStart.y) > 9) {
          clearTimeout(pressTimer);
          if (pressRow) pressRow.classList.remove("pressing");
          pressStart = null;
        }
      });
      const endPress = () => {
        clearTimeout(pressTimer);
        if (pressRow) pressRow.classList.remove("pressing");
        pressRow = null;
        pressStart = null;
      };
      ["pointerup", "pointercancel", "pointerleave"].forEach((type) => fileList.addEventListener(type, endPress));

        const row = event.target.closest("[data-row-id]");

        if (state.suppressClick === row.dataset.rowId) {
          state.suppressClick = null;
          return;
        }
        if (state.selectionMode) {
          toggleSelection(row.dataset.rowId);
          return;
        }
        const entry = currentEntries().find((item) => item.id === row.dataset.rowId);
        activateEntry(entry);

      fileList.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        if (event.target.closest("[data-check-id]")) return;
        const row = event.target.closest("[data-row-id]");

      // Breadcrumb navigation

        const data = archiveData[entry.archiveKey] || buildFallbackArchive(entry.name, entry.sizeBytes, entry.format);

              '<div class="info-list">' + data.rows.map((row) => '<div class="info-row"><span>' + escapeHTML(row[0]) + '</span><strong>' + escapeHTML(row[1]) + '</strong></div>').join("") + '</div>' +

            : sheetHeader(data.iconName || "i-info", data.title, data.subtitle || "当前项目") +

              '<button class="secondary-button" type="button" style="width:100%;margin-top:14px" data-sheet-action="close">关闭</button>';
        } else if (state.sheetType === "create") {
          const isFolder = data.kind === "folder";
          sheetContent.innerHTML = sheetHeader(isFolder ? "i-folder" : "i-archive-plus", isFolder ? "新建文件夹" : "新建压缩包", isFolder ? "输入文件夹名称" : "选择格式并命名压缩包") +
            '<div class="sheet-section"><p class="sheet-section-title">名称</p><input class="field-input" id="createName" value="' + (isFolder ? "新建文件夹" : "新建压缩包.zip") + '" autocomplete="off"></div>' +

      sheetContent.addEventListener("click", (event) => {
        const close = event.target.closest("[data-sheet-action='close']");
        if (close) { closeSheet(); return; }
        if (state.sheetType === "options") {
          const option = event.target.closest("[data-option-value]");
          if (option) {
            const value = option.dataset.optionValue;
            const callback = state.sheetData.onSelect;
            closeSheet();
            if (callback) callback(value);
          }
          return;
        }
        if (state.sheetType === "extract") {
          const targetButton = event.target.closest("#extractTargetButton");
          if (targetButton) {
            const menu = document.getElementById("extractTargetMenu");
            menu.hidden = !menu.hidden;
            return;
          }
          const targetOption = event.target.closest("[data-target]");
          if (targetOption) {
            state.sheetData.target = targetOption.dataset.target;
            document.getElementById("extractTargetValue").textContent = state.sheetData.target;
            document.getElementById("extractTargetMenu").hidden = true;
            return;
          }
          const segment = event.target.closest("[data-segment]");
          if (segment) {
            state.sheetData[segment.dataset.segment] = segment.dataset.value;
            segment.parentElement.querySelectorAll("[data-segment]").forEach((item) => {
              item.classList.toggle("active", item === segment);
              item.setAttribute("aria-pressed", String(item === segment));
            });
            return;
          }
          const eye = event.target.closest("#extractPasswordEye");
          if (eye) {
            const input = document.getElementById("extractPassword");
            const show = input.type === "password";
            input.type = show ? "text" : "password";
            eye.setAttribute("aria-pressed", String(show));
            eye.setAttribute("aria-label", show ? "隐藏密码" : "显示密码");
            eye.innerHTML = icon(show ? "i-eye-off" : "i-eye");

          if (event.target.closest("[data-sheet-action='start-extract']")) startExtraction();
          return;
        }
        if (state.sheetType === "create") {
          const format = event.target.closest("[data-create-format]");

            format.parentElement.querySelectorAll("[data-create-format]").forEach((item) => item.classList.toggle("active", item === format));
            state.sheetData.format = format.dataset.createFormat;
            const nameInput = document.getElementById("createName");
            if (nameInput && /\.[^.]+$/.test(nameInput.value.trim())) {
              nameInput.value = nameInput.value.trim().replace(/\.[^.]+$/, "." + state.sheetData.format);
            }
            return;
          }
          if (event.target.closest("[data-sheet-action='create-confirm']")) createFromSheet();

      sheetContent.addEventListener("input", (event) => {
        if (event.target.id !== "extractPassword") return;

          event.target.removeAttribute("aria-invalid");

      function openExtractSheet(sources) {
        if (!sources || !sources.length) return;
        openSheet("extract", {
          sources,
          target: "Download / 解压",
          conflict: settings.conflict,
          encoding: settings.encoding
        }, "#extractTargetButton");
      }

      function startExtraction() {
        const data = state.sheetData;
        const required = data.sources.some((source) => source.encrypted);
        const password = document.getElementById("extractPassword").value.trim();
        if (required && password.length < 4) {
          document.getElementById("extractPasswordWrap").classList.add("has-error");
          document.getElementById("extractPassword").setAttribute("aria-invalid", "true");
          document.getElementById("extractPasswordError").hidden = false;
          document.getElementById("extractPassword").focus();
          return;
        }
        const total = data.sources.reduce((sum, source) => sum + source.unpackedBytes, 0);
        const speed = total >= 1073741824 ? "286 MB/s" : total >= 104857600 ? "42.6 MB/s" : "8.4 MB/s";
        const name = data.sources.length === 1 ? data.sources[0].name : data.sources.length + " 个压缩包";
        const task = {
          id: nextUid("task"),
          name,
          progress: 0,
          status: "running",
          duration: 4000,
          lastTick: performance.now(),
          speed,
          target: data.target,
          completedTarget: data.target + " / " + (data.sources.length === 1 ? data.sources[0].name.replace(/\.[^.]+$/, "") : "已解压文件"),
          conflict: data.conflict,
          encoding: data.encoding
        };
        tasks.unshift(task);
        state.currentTaskId = task.id;
        clearSelection();
        closeSheet();
        renderAll();
        openTaskDrawer(false);
        showToast("已开始解压到 " + data.target);
      }

      function createFromSheet() {
        const nameInput = document.getElementById("createName");
        const name = nameInput.value.trim();
        if (!name) {
          nameInput.focus();
          showToast("请输入名称");
          return;
        }
        if (state.mode !== "files") {
          closeSheet();
          showToast("请在文件目录中创建");
          return;
        }
        const dir = dirs[currentDirId()];
        if (state.sheetData.kind === "folder") {
          const dirId = nextUid("folder");
          dirs[dirId] = { name, parent: currentDirId(), entries: [] };
          const id = nextUid("entry");
          entries[id] = { id, kind: "folder", name, childDir: dirId, modified: Date.now() };
          dir.entries.unshift(id);
          closeSheet();
          renderAll();
          showToast("文件夹已创建");
          return;
        }
        let finalName = name;
        const format = state.sheetData.format || "zip";
        if (!/\.[^.]+$/.test(finalName)) finalName += "." + format;
        else if (!finalName.toLowerCase().endsWith("." + format)) finalName = finalName.replace(/\.[^.]+$/, "") + "." + format;
        const id = nextUid("entry");
        const archiveKey = nextUid("created");
        const selected = state.sheetData.selected || [];
        entries[id] = {
          id,
          kind: "archive",
          name: finalName,
          sizeBytes: selected.reduce((sum, entry) => sum + (entry.sizeBytes || 0), 1048576),
          format: format.toUpperCase(),
          archiveKey,
          modified: Date.now()
        };
        archiveData[archiveKey] = {
          name: finalName,
          sizeBytes: entries[id].sizeBytes,
          format: format.toUpperCase(),
          modified: Date.now(),
          encrypted: false,
          unpackedBytes: Math.max(entries[id].sizeBytes * 1.3, 1048576),
          totalItems: Math.max(selected.length, 1),
          folders: {
            "": selected.length
              ? selected.map((entry, index) => internalEntry("created-" + index, entry.name, entry.kind === "folder" ? "folder" : "file", entry.sizeBytes || 0, entry.modified || Date.now(), { folderKey: "", itemCount: entry.itemCount || 0 }))
              : [internalEntry("created-readme", "README.txt", "file", 1024, Date.now())]
          }
        };
        dir.entries.unshift(id);
        clearSelection();
        closeSheet();
        renderAll();
        showToast("已创建 " + finalName);
      }

      function openCreateSheet(kind, selected) {
        if (state.mode === "archive") {
          showToast("请在文件目录中创建");
          return;
        }
        openSheet("create", { kind, format: "zip", selected: selected || [] }, "#createName");
      }

      function openDeleteConfirm() {
        if (state.mode !== "files" || !state.selected.size) return;
        const count = state.selected.size;
        openSheet("confirm", {
          title: "删除 " + count + " 项？",
          description: "删除后不会保留副本。",
          onConfirm: () => {
            const dir = dirs[currentDirId()];
            dir.entries = dir.entries.filter((id) => !state.selected.has(id));
            clearSelection();
            renderAll();
            showToast("已删除 " + count + " 项");
          }
        });
      }

      function openDestinationSheet(mode) {
        if (state.mode !== "files" || !state.selected.size) return;
        const options = [
          { value: "download", label: "Download", sublabel: "内部存储 / Download" },
          { value: "documents", label: "Documents", sublabel: "内部存储 / Documents" },
          { value: "materials", label: "素材", sublabel: "内部存储 / Download / 素材" },
          { value: "archives", label: "压缩包", sublabel: "内部存储 / Download / 素材 / 压缩包" }
        ];
        openOptionsSheet(mode === "copy" ? "复制到" : "移动到", "选择目标文件夹", options, currentDirId(), (targetDir) => {
          const selected = selectedEntries();
          const source = dirs[currentDirId()];
          if (mode === "move") {
            selected.forEach((entry) => {
              source.entries = source.entries.filter((id) => id !== entry.id);
              dirs[targetDir].entries.unshift(entry.id);
              if (entry.kind === "folder" && dirs[entry.childDir]) dirs[entry.childDir].parent = targetDir;
            });
          } else {
            selected.forEach((entry) => {
              const clone = cloneEntry(entry, targetDir);
              dirs[targetDir].entries.unshift(clone.id);
            });
          }
          const action = mode === "copy" ? "复制" : "移动";
          const count = selected.length;
          clearSelection();
          renderAll();
          showToast("已" + action + " " + count + " 项到 " + dirs[targetDir].name);
        });
      }

      function cloneEntry(entry, targetDir) {
        const id = nextUid("entry");
        if (entry.kind === "folder") {
          const childDir = nextUid("folder");
          dirs[childDir] = { name: entry.name + " 副本", parent: targetDir, entries: [] };
          dirs[entry.childDir].entries.forEach((childId) => {
            const child = entries[childId];
            if (child) dirs[childDir].entries.push(cloneEntry(child, childDir).id);
          });
          entries[id] = { id, kind: "folder", name: entry.name + " 副本", childDir, modified: Date.now() };
        } else {
          entries[id] = Object.assign({}, entry, { id, name: entry.name.replace(/(\.[^.]+)$/, " 副本$1"), modified: Date.now() });
        }
        return entries[id];
      }

      function openInfo(title, rows, subtitle) {
        openSheet("info", { title, subtitle, rows: rows.map((row) => [row[0], row[1] || "—"]) });
      }
      function openArchiveInfo() {
        const archive = currentArchive();
        openInfo("压缩包信息", [
          ["名称", archive.name],
          ["格式", archive.format],
          ["压缩后大小", formatBytes(archive.sizeBytes)],
          ["解压后预计", formatBytes(archive.unpackedBytes)],
          ["文件数量", archive.totalItems + " 个"],
          ["加密", archive.encrypted ? "是" : "否"],
          ["修改日期", new Date(archive.modified).toLocaleString("zh-CN", { hour12: false })]
        ], "压缩包");
      }

      // Task drawer
      function taskCounts() {
        return {
          running: tasks.filter((task) => task.status === "running").length,
          waiting: tasks.filter((task) => task.status === "waiting" || task.status === "paused").length,
          completed: tasks.filter((task) => task.status === "completed").length
        };
      }
      function currentTask() {
        return tasks.find((task) => task.id === state.currentTaskId) || tasks.find((task) => task.status === "running") || tasks[0];
      }
      function taskStatusLabel(task) {
        return task.status === "running" ? "解压中" : task.status === "paused" ? "已暂停" : task.status === "waiting" ? "等待" : "已完成";
      }
      function renderTaskDrawer(rebuildQueue = true) {
        if (!state.drawerVisible) return;
        const current = currentTask();
        if (!current) return;
        const counts = taskCounts();
        document.getElementById("drawerSummary").textContent = counts.running + " 进行中 · " + counts.waiting + " 等待 · " + counts.completed + " 已完成";
        document.getElementById("currentTaskName").textContent = current.name;
        const stateEl = document.getElementById("currentTaskState");
        stateEl.className = "task-state " + current.status;
        stateEl.textContent = taskStatusLabel(current);
        const currentCard = document.getElementById("drawerCurrent");
        currentCard.classList.toggle("paused", current.status === "paused" || current.status === "waiting");
        currentCard.classList.toggle("completed", current.status === "completed");
        document.getElementById("currentTaskProgress").style.width = current.progress + "%";
        const remaining = current.status === "running" ? Math.max(1, Math.ceil((100 - current.progress) / 100 * current.duration / 1000)) : 0;
        document.getElementById("currentTaskLeft").textContent = current.status === "completed"
          ? "解压完成"
          : current.status === "waiting"
            ? "等待处理"
            : current.status === "paused"
              ? "已暂停"
              : current.speed + " · 剩余 " + remaining + " 秒";
        document.getElementById("currentTaskRight").textContent = current.status === "completed" ? current.completedTarget : current.target;
        const toggle = document.getElementById("currentTaskToggle");
        if (current.status === "completed") {
          toggle.className = "task-toggle complete";
          toggle.innerHTML = icon("i-check-circle");
          toggle.disabled = true;
        } else {
          toggle.className = "task-toggle";
          toggle.innerHTML = icon(current.status === "running" ? "i-pause" : "i-play");
          toggle.disabled = false;
          toggle.setAttribute("aria-label", current.status === "running" ? "暂停当前任务" : "继续当前任务");
        }
        document.getElementById("taskRunning").textContent = counts.running;
        document.getElementById("taskWaiting").textContent = counts.waiting;
        document.getElementById("taskComplete").textContent = counts.completed;
        if (rebuildQueue) renderQueueList();
        tasks.forEach((task) => {
          const row = document.querySelector('[data-task-row="' + task.id + '"]');
          if (!row) return;
          row.querySelector("[data-task-progress]").style.width = task.progress + "%";
          row.querySelector("[data-task-percent]").textContent = Math.round(task.progress) + "%";
          const status = row.querySelector("[data-task-status]");
          status.className = "task-state " + task.status;
          status.textContent = taskStatusLabel(task);
        });
        renderSettingsTaskSummary();
      }
      function renderQueueList() {
        const list = document.getElementById("queueList");
        list.innerHTML = tasks.map((task) => {
          const statusText = taskStatusLabel(task);
          const button = task.status === "completed"
            ? '<button class="task-toggle complete" type="button" disabled>' + icon("i-check-circle") + '</button>'
            : '<button class="task-toggle" type="button" data-task-toggle="' + task.id + '" aria-label="' + (task.status === "running" ? "暂停" : "继续") + ' ' + escapeHTML(task.name) + '">' + icon(task.status === "running" ? "i-pause" : "i-play") + '</button>';
          return '<div class="queue-row" data-task-row="' + task.id + '"><div class="queue-row-copy"><div class="queue-row-title"><strong>' + escapeHTML(task.name) + '</strong><span class="task-state ' + task.status + '" data-task-status>' + statusText + '</span></div>' +
            '<div class="linear-progress"><span data-task-progress style="width:' + task.progress + '%"></span></div><div class="queue-row-meta"><span data-task-percent>' + Math.round(task.progress) + '%</span><span>' + escapeHTML(task.target) + '</span></div></div>' + button + '</div>';
        }).join("");
      }
      function renderSettingsTaskSummary() {
        const counts = taskCounts();
        document.getElementById("settingsTaskSummary").textContent = counts.running + " 进行中 · " + counts.waiting + " 等待";
      }
      function openTaskDrawer(expanded) {
        state.drawerVisible = true;
        taskDrawer.hidden = false;
        if (!state.currentTaskId) state.currentTaskId = currentTask() ? currentTask().id : null;
        setDrawerExpanded(Boolean(expanded));
        browserView.classList.add("task-mode");
        renderTaskDrawer(true);
      }
      function closeTaskDrawer() {
        state.drawerVisible = false;
        taskDrawer.hidden = true;
        drawerScrim.hidden = true;
        drawerScrim.classList.remove("show");
        browserView.classList.remove("task-mode");
      }
      function setDrawerExpanded(expanded) {
        state.drawerExpanded = expanded;
        taskDrawer.classList.toggle("expanded", expanded);
        document.getElementById("drawerBody").hidden = !expanded;
        drawerScrim.hidden = !expanded;
        requestAnimationFrame(() => drawerScrim.classList.toggle("show", expanded));
        const toggle = document.getElementById("drawerExpand");
        toggle.setAttribute("aria-expanded", String(expanded));
        toggle.querySelector("use").setAttribute("href", expanded ? "#i-chevron-down" : "#i-chevron-up");
        if (expanded) renderTaskDrawer();
      }
      document.getElementById("drawerHandle").addEventListener("click", () => setDrawerExpanded(!state.drawerExpanded));
      document.getElementById("drawerExpand").addEventListener("click", () => setDrawerExpanded(!state.drawerExpanded));
      document.getElementById("drawerClose").addEventListener("click", closeTaskDrawer);
      drawerScrim.addEventListener("click", () => setDrawerExpanded(false));
      function toggleTask(id) {
        const task = tasks.find((item) => item.id === id);
        if (!task || task.status === "completed") return;
        if (task.status === "running") {
          task.status = "paused";
          showToast(task.name + " 已暂停");
        } else {
          task.status = "running";
          task.lastTick = performance.now();
          showToast(task.name + " 已继续");
        }
        renderTaskDrawer();
      }
      document.getElementById("currentTaskToggle").addEventListener("click", () => {
        const current = currentTask();
        if (current) toggleTask(current.id);
      });
      document.getElementById("queueList").addEventListener("click", (event) => {
        const button = event.target.closest("[data-task-toggle]");
        if (button) toggleTask(button.dataset.taskToggle);
      });

      setInterval(() => {
        const now = performance.now();
        let changed = false;
        let completedNow = false;
        const completedTasks = [];
        tasks.forEach((task) => {
          if (task.status !== "running") return;
          if (!task.lastTick) task.lastTick = now;
          const delta = Math.max(0, now - task.lastTick);
          task.lastTick = now;
          task.progress = Math.min(100, task.progress + (delta / task.duration) * 100);
          if (task.progress >= 100) {
            if (task.status !== "completed") completedNow = true;
            task.progress = 100;
            task.status = "completed";
            task.speed = "已完成";
            task.finishedAt = Date.now();
            completedTasks.push(task);
          }
          changed = true;
        });
        if (changed && state.drawerVisible) {
          renderTaskDrawer(completedNow);
          const active = currentTask();
          if (active && completedTasks.some((task) => task.id === active.id)) showToast(active.name + " 解压完成 · 已保存到 " + active.completedTarget);
        }
        if (changed) renderSettingsTaskSummary();
      }, 180);

      // Generic modal focus trap
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          if (!sheetLayer.hidden) { closeSheet(); return; }
          if (!sortMenu.hidden || !moreMenu.hidden) { closeMenus(); return; }
          if (!taskDrawer.hidden && state.drawerExpanded) { setDrawerExpanded(false); return; }
          if (settingsView.classList.contains("open")) { closeSettings(); return; }
          goBack();
          return;
        }
        if (event.key === "Tab" && !sheetLayer.hidden) {
          const focusables = Array.from(sheetContent.querySelectorAll("button:not([disabled]), input:not([disabled])")).filter((el) => !el.hidden);
          if (!focusables.length) return;
          const first = focusables[0];
          const last = focusables[focusables.length - 1];
          if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
          else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
        }
      });

      function setSystemTime() {
        document.getElementById("systemTime").textContent = new Intl.DateTimeFormat("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date());
      }

      setSystemTime();
      setInterval(setSystemTime, 30000);
      setTheme(settings.theme);
      renderSettings();
      renderAll();
    })();
  </script>
</body>
</html>

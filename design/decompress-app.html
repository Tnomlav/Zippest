        if (state.selectionMode) {
          clearSelection();
          renderAll();

        if (state.searchMode) {

      function performBackGesture() {
        if (folderPicker.classList.contains("open")) {
          if (pickerState.path.length > 1) {
            pickerState.path.pop();
            renderFolderPicker();
          } else {
            closeFolderPicker();
          }
          return;
        }
        if (!sheetLayer.hidden) {
          closeSheet();
          return;
        }
        if (settingsView.classList.contains("open")) {
          closeSettings();
          return;
        }
        if (!taskDrawer.hidden) {
          closeTaskDrawer();
          return;
        }
        goBack();
      }
      function performHomeGesture() {
        if (folderPicker.classList.contains("open")) closeFolderPicker();
        if (!sheetLayer.hidden) closeSheet();
        if (settingsView.classList.contains("open")) closeSettings(false);
        closeTaskDrawer();
        closeMenus();
        clearSelection();
        state.volume = "internal";
        state.mode = "files";
        state.dirPath = ["storage"];
        state.archiveKey = null;
        state.archivePath = [];
        state.searchMode = false;
        state.query = "";
        searchInput.value = "";
        renderAll();
        fileScroll.scrollTop = 0;

      let edgeGesture = null;
      const gestureApp = document.getElementById("app");
      gestureApp.addEventListener("pointerdown", (event) => {
        if (event.button > 0) return;
        const rect = gestureApp.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        let mode = null;
        if (x <= 24 || x >= rect.width - 24) mode = "back";
        else if (y >= rect.height - 20) mode = "home";
        if (!mode) return;
        edgeGesture = { mode, pointerId: event.pointerId, startX: event.clientX, startY: event.clientY };
        if (mode === "back") {
          try { gestureApp.setPointerCapture(event.pointerId); } catch (error) {}
        }
      });
      gestureApp.addEventListener("pointerup", (event) => {
        if (!edgeGesture || event.pointerId !== edgeGesture.pointerId) return;
        const { mode, startX, startY } = edgeGesture;
        edgeGesture = null;
        const dx = event.clientX - startX;
        const dy = event.clientY - startY;
        if (mode === "back" && Math.abs(dx) >= 70 && Math.abs(dy) <= 70) performBackGesture();
        else if (mode === "home" && dy <= -70 && Math.abs(dx) <= 90) performHomeGesture();
      });
      gestureApp.addEventListener("pointercancel", () => { edgeGesture = null; });
      document.getElementById("gestureHomeButton").addEventListener("click", performHomeGesture);

        const row = event.target.closest("[data-row-id]");
        if (!row || event.button > 0 || event.target.closest("[data-check-id]") || state.mode !== "files") return;
        pressStart = { x: event.clientX, y: event.clientY };
        pressRow = row;
        row.classList.add("pressing");
        clearTimeout(pressTimer);
        pressTimer = setTimeout(() => {
          const id = row.dataset.rowId;
          state.suppressClick = id;
          if (!state.selectionMode) enterSelection(id);
          else toggleSelection(id);
          setTimeout(() => {
            if (state.suppressClick === id) state.suppressClick = null;
          }, 900);

      fileList.addEventListener("pointermove", (event) => {
        if (!pressStart) return;

          clearTimeout(pressTimer);
          if (pressRow) pressRow.classList.remove("pressing");
          pressStart = null;
        }
      });
      const endPress = () => {
        clearTimeout(pressTimer);
        if (pressRow) pressRow.classList.remove("pressing");
        pressRow = null;
        pressStart = null;
      };
      ["pointerup", "pointercancel", "pointerleave"].forEach((type) => fileList.addEventListener(type, endPress));

            '<div class="space-line">' + icon("i-folder") + '保存到 ' + escapeHTML(state.dirPath.map((id) => dirs[id].name).join(" / ")) + '</div>' +

      sheetContent.addEventListener("click", (event) => {
        const close = event.target.closest("[data-sheet-action='close']");
        if (close) { closeSheet(); return; }
        if (state.sheetType === "options") {
          const option = event.target.closest("[data-option-value]");
          if (option) {
            const value = option.dataset.optionValue;
            const callback = state.sheetData.onSelect;
            closeSheet();
            if (callback) callback(value);
          }
          return;
        }
        if (state.sheetType === "extract") {
          const destination = event.target.closest("[data-dest-mode]");
          if (destination) {
            state.sheetData.destMode = destination.dataset.destMode;
            document.querySelectorAll("#sheetContent [data-dest-mode]").forEach((item) => {
              const active = item === destination;
              item.classList.toggle("active", active);
              item.setAttribute("aria-pressed", String(active));
            });
            if (state.sheetData.destMode === "custom") openFolderPicker();
            return;
          }
          const samePasswordToggle = event.target.closest("#samePasswordToggle");
          if (samePasswordToggle) {
            state.sheetData.samePassword = !state.sheetData.samePassword;
            samePasswordToggle.setAttribute("aria-checked", String(state.sheetData.samePassword));
            const hint = document.getElementById("samePasswordHint");
            if (hint) hint.textContent = state.sheetData.samePassword
              ? "对本次选择的 " + state.sheetData.sources.length + " 个压缩包复用此密码"
              : "关闭时，将逐个输入密码";

          }
          const clipboardButton = event.target.closest("#extractClipboardButton");
          if (clipboardButton) {
            const panel = document.getElementById("extractClipboardPanel");
            if (panel) {
              const willOpen = panel.hidden;
              panel.hidden = !willOpen;
              clipboardButton.setAttribute("aria-expanded", String(willOpen));
              if (willOpen) refreshClipboardFromSystem();
            }
            return;
          }
          if (event.target.closest("[data-sheet-action='close-clipboard']")) {
            const panel = document.getElementById("extractClipboardPanel");
            if (panel) panel.hidden = true;
            const row = document.getElementById("extractClipboardButton");
            if (row) row.setAttribute("aria-expanded", "false");
            return;
          }
          const clipboardItem = event.target.closest("[data-clipboard-value]");
          if (clipboardItem) {
            const value = clipboardItem.dataset.clipboardValue;
            const input = document.getElementById("extractPassword");
            if (input) {
              input.value = value;
              input.focus();
              input.dispatchEvent(new Event("input", { bubbles: true }));
            }
            setLastClipboard(value);
            const panel = document.getElementById("extractClipboardPanel");
            if (panel) panel.hidden = true;
            const row = document.getElementById("extractClipboardButton");
            if (row) row.setAttribute("aria-expanded", "false");
            return;
          }
          const segment = event.target.closest("[data-segment]");
          if (segment) {
            state.sheetData[segment.dataset.segment] = segment.dataset.value;
            segment.parentElement.querySelectorAll("[data-segment]").forEach((item) => {
              item.classList.toggle("active", item === segment);
              item.setAttribute("aria-pressed", String(item === segment));
            });
            return;
          }
          const eye = event.target.closest("#extractPasswordEye");
          if (eye) {
            const input = document.getElementById("extractPassword");
            const show = input.type === "password";
            input.type = show ? "text" : "password";
            eye.setAttribute("aria-pressed", String(show));
            eye.setAttribute("aria-label", show ? "隐藏密码" : "显示密码");
            eye.innerHTML = icon(show ? "i-eye-off" : "i-eye");
            return;
          }
          if (event.target.closest("[data-sheet-action='start-extract']")) startExtraction();
          return;
        }
        if (state.sheetType === "rename") {
          if (event.target.closest("[data-sheet-action='rename-confirm']")) renameFromSheet();
          return;
        }
        if (state.sheetType === "create") {
          const format = event.target.closest("[data-create-format]");
          if (format) {
            format.parentElement.querySelectorAll("[data-create-format]").forEach((item) => item.classList.toggle("active", item === format));

            if (nameInput && /\.[^.]+$/.test(nameInput.value.trim())) {
              nameInput.value = nameInput.value.trim().replace(/\.[^.]+$/, "." + state.sheetData.format);
            }

          }
          if (event.target.closest("[data-sheet-action='create-confirm']")) createFromSheet();

        }
        if (state.sheetType === "confirm" && event.target.closest("[data-sheet-action='confirm-delete']")) {
          const callback = state.sheetData.onConfirm;
          closeSheet();
          if (callback) callback();

      sheetContent.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && state.sheetType === "rename") {
          event.preventDefault();
          renameFromSheet();
        }

      sheetContent.addEventListener("input", (event) => {
        if (event.target.id !== "extractPassword") return;
        if (event.target.value.trim().length >= 4) {
          document.getElementById("extractPasswordWrap").classList.remove("has-error");
          event.target.removeAttribute("aria-invalid");
          document.getElementById("extractPasswordError").hidden = true;
        }
      });

      function renderFolderPicker() {
        const volume = volumes[pickerState.volume] || volumes.internal;
        if (pickerState.path[0] !== volume.root) pickerState.path = [volume.root];
        const currentId = pickerState.path[pickerState.path.length - 1];
        const dir = dirs[currentId] || dirs[volume.root];
        folderPickerTitle.textContent = dir.name;
        folderPickerPath.textContent = pickerState.path.map((id) => (dirs[id] || {}).name).filter(Boolean).join(" / ");
        folderPickerVolumes.querySelectorAll("[data-picker-volume]").forEach((button) => {
          const active = button.dataset.pickerVolume === pickerState.volume;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        });
        const folders = (dir.entries || []).map((id) => entries[id]).filter((entry) => entry && entry.kind === "folder");
        folderPickerList.innerHTML = folders.length
          ? folders.map((entry) => '<button class="folder-picker-row" type="button" data-picker-dir="' + entry.childDir + '">' +
              '<span class="file-icon folder">' + icon("i-folder") + '</span>' +
              '<span class="folder-picker-copy"><strong>' + escapeHTML(entry.name) + '</strong><span>' + (entry.itemCount || folderItemCount(entry.childDir)) + ' 项</span></span>' +
              '<svg class="icon row-chevron"><use href="#i-chevron"/></svg></button>').join("")
          : '<div class="folder-picker-empty">此文件夹没有子文件夹</div>';
      }
      function openFolderPicker(purpose = "extract", actionMode = null) {
        closeMenus();
        pickerState.purpose = purpose;
        pickerState.actionMode = actionMode;
        folderPickerSelect.textContent = purpose === "copy" ? "复制到这里" : purpose === "move" ? "移动到这里" : "选择此文件夹";
        appMain.inert = true;
        const volumeId = volumes[state.volume] ? state.volume : "internal";
        pickerState.volume = volumeId;
        const root = volumes[volumeId].root;
        pickerState.path = state.dirPath[0] === root ? [...state.dirPath] : [root];
        renderFolderPicker();
        folderPicker.classList.add("open");
        folderPicker.removeAttribute("aria-hidden");
        sheetLayer.inert = true;
        setTimeout(() => folderPickerSelect.focus(), 120);
      }
      function closeFolderPicker() {
        folderPicker.classList.remove("open");
        folderPicker.setAttribute("aria-hidden", "true");
        sheetLayer.inert = false;
        appMain.inert = !sheetLayer.hidden;
        setTimeout(() => {
          const toolbarButton = document.getElementById(pickerState.actionMode === "move" ? "defaultMove" : "defaultCopy");
          const focusTarget = pickerState.purpose === "extract"
            ? document.querySelector('[data-dest-mode="custom"]')
            : toolbarButton && !toolbarButton.closest("[hidden]") ? toolbarButton : document.getElementById("topBackButton");
          if (focusTarget) focusTarget.focus();
        }, 100);
      }
      function isInsideFolder(targetDirId, ancestorDirId) {
        let cursor = targetDirId;
        const seen = new Set();
        while (cursor && dirs[cursor] && !seen.has(cursor)) {
          if (cursor === ancestorDirId) return true;
          seen.add(cursor);
          cursor = dirs[cursor].parent;
        }
        return false;
      }
      function transferSelectedTo(targetDirId, mode) {
        if (!dirs[targetDirId]) return false;
        const selected = selectedEntries();
        if (!selected.length) return false;
        if (mode === "move" && targetDirId === currentDirId()) {
          showToast("目标位置与当前位置相同");
          return false;
        }
        if (selected.some((entry) => entry.kind === "folder" && isInsideFolder(targetDirId, entry.childDir))) {
          showToast("不能复制或移动到自身内部");
          return false;
        }
        const source = dirs[currentDirId()];
        if (mode === "move") {
          selected.forEach((entry) => {
            source.entries = source.entries.filter((id) => id !== entry.id);
            dirs[targetDirId].entries.unshift(entry.id);
            if (entry.kind === "folder" && dirs[entry.childDir]) dirs[entry.childDir].parent = targetDirId;
          });
        } else {
          selected.forEach((entry) => {
            const clone = cloneEntry(entry, targetDirId);
            dirs[targetDirId].entries.unshift(clone.id);
          });
        }
        const count = selected.length;
        const action = mode === "copy" ? "复制" : "移动";
        clearSelection();
        renderAll();
        showToast("已" + action + " " + count + " 项到 " + dirs[targetDirId].name);
        return true;
      }
      function selectFolderFromPicker() {
        const targetDirId = pickerState.path[pickerState.path.length - 1];
        if (pickerState.purpose === "copy" || pickerState.purpose === "move") {
          if (transferSelectedTo(targetDirId, pickerState.purpose)) closeFolderPicker();
          return;
        }
        if (!state.sheetData) return;
        const path = pickerState.path.map((id) => (dirs[id] || {}).name).filter(Boolean).join(" / ");
        state.sheetData.customTarget = path;
        state.sheetData.customDirId = targetDirId;
        state.sheetData.customVolume = pickerState.volume;
        state.sheetData.destMode = "custom";
        const customOption = document.querySelector('[data-dest-mode="custom"]');
        if (customOption) {
          document.querySelectorAll("#sheetContent [data-dest-mode]").forEach((item) => {
            const active = item === customOption;
            item.classList.toggle("active", active);
            item.setAttribute("aria-pressed", String(active));
          });
          const detail = customOption.querySelector("small");
          if (detail) detail.textContent = path;
        }
        closeFolderPicker();
      }
      document.getElementById("folderPickerBack").addEventListener("click", () => {
        if (pickerState.path.length > 1) {
          pickerState.path.pop();
          renderFolderPicker();
        } else {
          closeFolderPicker();
        }
      });
      document.getElementById("folderPickerClose").addEventListener("click", closeFolderPicker);
      folderPickerSelect.addEventListener("click", selectFolderFromPicker);
      folderPickerVolumes.addEventListener("click", (event) => {
        const button = event.target.closest("[data-picker-volume]");
        if (!button || !volumes[button.dataset.pickerVolume]) return;
        pickerState.volume = button.dataset.pickerVolume;
        pickerState.path = [volumes[pickerState.volume].root];
        renderFolderPicker();
      });
      folderPickerList.addEventListener("click", (event) => {
        const row = event.target.closest("[data-picker-dir]");
        if (!row) return;
        pickerState.path.push(row.dataset.pickerDir);
        renderFolderPicker();
      });

      function openExtractSheet(sources) {
        if (!sources || !sources.length) return;
        const required = sources.some((source) => source.encrypted);
        const sourceFolder = state.dirPath.map((id) => dirs[id].name).join(" / ");
        const folderName = sources.length === 1 ? sources[0].name.replace(/\.[^.]+$/, "") : "解压文件";
        openSheet("extract", {
          sources,
          destMode: "new-folder",
          samePassword: false,
          customTarget: sourceFolder,
          customDirId: currentDirId(),
          customVolume: state.volume,
          sourceFolder,
          folderName,
          conflict: settings.conflict,
          encoding: settings.encoding
        }, required ? "#extractPassword" : "#extractClipboardButton");
      }

      function startExtraction() {
        const data = state.sheetData;
        const required = data.sources.some((source) => source.encrypted);
        const password = document.getElementById("extractPassword").value.trim();
        if (required && password.length < 4) {
          document.getElementById("extractPasswordWrap").classList.add("has-error");
          document.getElementById("extractPassword").setAttribute("aria-invalid", "true");
          document.getElementById("extractPasswordError").hidden = false;
          document.getElementById("extractPassword").focus();
          return;
        }
        const total = data.sources.reduce((sum, source) => sum + source.unpackedBytes, 0);
        const speed = total >= 1073741824 ? "286 MB/s" : total >= 104857600 ? "42.6 MB/s" : "8.4 MB/s";
        const name = data.sources.length === 1 ? data.sources[0].name : data.sources.length + " 个压缩包";
        const destMode = data.destMode || "new-folder";
        const sourceFolder = data.sourceFolder || state.dirPath.map((id) => dirs[id].name).join(" / ");
        const folderName = data.folderName || "解压文件";
        const destination = destMode === "custom"
          ? (data.customTarget || sourceFolder)
          : destMode === "new-folder" ? sourceFolder + " / " + folderName : sourceFolder;
        const destinationParentId = destMode === "custom" ? (data.customDirId || currentDirId()) : currentDirId();
        const destinationVolume = destMode === "custom" ? (data.customVolume || state.volume) : state.volume;
        const task = {
          id: nextUid("task"),
          name,
          progress: 0,
          status: "running",
          duration: 4000,
          lastTick: performance.now(),
          speed,
          target: destination,
          completedTarget: destination + " / " + (data.sources.length === 1 ? data.sources[0].name.replace(/\.[^.]+$/, "") : "已解压文件"),
          conflict: data.conflict,
          encoding: data.encoding,
          samePassword: Boolean(data.samePassword),
          destinationParentId,
          folderName,
          volumeId: destinationVolume,
          unpackedBytes: total,
          materialized: false
        };
        tasks.unshift(task);
        state.currentTaskId = task.id;
        clearSelection();
        closeSheet();
        renderAll();
        openTaskDrawer(false);
        showToast("已开始解压到 " + destination);
      }

      function createFromSheet() {
        const nameInput = document.getElementById("createName");
        const name = nameInput.value.trim();
        if (!name) {
          nameInput.focus();
          showToast("请输入名称");
          return;
        }
        if (state.mode !== "files") {
          closeSheet();
          showToast("请在文件目录中创建");
          return;
        }
        const dir = dirs[currentDirId()];
        if (state.sheetData.kind === "folder") {
          const dirId = nextUid("folder");
          dirs[dirId] = { name, parent: currentDirId(), entries: [] };
          const id = nextUid("entry");
          entries[id] = { id, kind: "folder", name, childDir: dirId, modified: Date.now() };
          dir.entries.unshift(id);
          closeSheet();
          renderAll();
          showToast("文件夹已创建");
          return;
        }
        let finalName = name;
        const format = state.sheetData.format || "zip";
        if (!/\.[^.]+$/.test(finalName)) finalName += "." + format;
        else if (!finalName.toLowerCase().endsWith("." + format)) finalName = finalName.replace(/\.[^.]+$/, "") + "." + format;
        const id = nextUid("entry");
        const archiveKey = nextUid("created");
        const selected = state.sheetData.selected || [];
        entries[id] = {
          id,
          kind: "archive",
          name: finalName,
          sizeBytes: selected.reduce((sum, entry) => sum + (entry.sizeBytes || 0), 1048576),
          format: format.toUpperCase(),
          archiveKey,
          modified: Date.now()
        };
        archiveData[archiveKey] = {
          name: finalName,
          sizeBytes: entries[id].sizeBytes,
          format: format.toUpperCase(),
          modified: Date.now(),
          encrypted: false,
          unpackedBytes: Math.max(entries[id].sizeBytes * 1.3, 1048576),
          totalItems: Math.max(selected.length, 1),
          folders: {
            "": selected.length
              ? selected.map((entry, index) => internalEntry("created-" + index, entry.name, entry.kind === "folder" ? "folder" : "file", entry.sizeBytes || 0, entry.modified || Date.now(), { folderKey: "", itemCount: entry.itemCount || 0 }))
              : [internalEntry("created-readme", "README.txt", "file", 1024, Date.now())]
          }
        };
        dir.entries.unshift(id);
        clearSelection();
        closeSheet();
        renderAll();
        showToast("已创建 " + finalName);
      }

      function openCreateSheet(kind, selected) {
        if (state.mode === "archive") {
          showToast("请在文件目录中创建");
          return;
        }
        openSheet("create", { kind, format: "zip", selected: selected || [] }, "#createName");
      }

      function openNewItemSheet() {
        if (state.mode === "archive") {
          showToast("请在文件目录中新建");
          return;
        }
        openOptionsSheet("新建", "选择要创建的项目类型。", ["新建文件夹", "新建压缩包"], "", (value) => {
          openCreateSheet(value === "新建文件夹" ? "folder" : "archive");
        });
      }

      function openDeleteConfirm() {
        if (state.mode !== "files" || !state.selected.size) return;
        const count = state.selected.size;
        openSheet("confirm", {
          title: "删除 " + count + " 项？",
          description: "删除后不会保留副本。",
          onConfirm: () => {
            const dir = dirs[currentDirId()];
            dir.entries = dir.entries.filter((id) => !state.selected.has(id));
            clearSelection();
            renderAll();
            showToast("已删除 " + count + " 项");
          }
        });
      }

      function openDestinationSheet(mode) {
        if (state.mode !== "files" || !state.selected.size) return;
        openFolderPicker(mode, mode);
      }

      function cloneEntry(entry, targetDir) {
        const id = nextUid("entry");
        if (entry.kind === "folder") {
          const childDir = nextUid("folder");
          dirs[childDir] = { name: entry.name + " 副本", parent: targetDir, entries: [] };
          dirs[entry.childDir].entries.forEach((childId) => {
            const child = entries[childId];
            if (child) dirs[childDir].entries.push(cloneEntry(child, childDir).id);
          });
          entries[id] = { id, kind: "folder", name: entry.name + " 副本", childDir, modified: Date.now() };
        } else {
          entries[id] = Object.assign({}, entry, { id, name: entry.name.replace(/(\.[^.]+)$/, " 副本$1"), modified: Date.now() });
        }
        return entries[id];
      }

      function selectedEntryList() {
        return currentEntries().filter((entry) => state.selected.has(entry.id));
      }
      function openRenameSheet() {
        if (state.mode !== "files") {
          showToast("包内文件暂不支持重命名");
          return;
        }
        const selected = selectedEntryList();
        if (selected.length !== 1) {
          showToast("请选择 1 个文件或文件夹重命名");
          return;
        }
        openSheet("rename", { id: selected[0].id, name: selected[0].name }, "#renameInput");
      }
      function renameFromSheet() {
        const data = state.sheetData || {};
        const input = document.getElementById("renameInput");
        const name = input ? input.value.trim() : "";
        if (!name) {
          showToast("名称不能为空");
          if (input) input.focus();
          return;

        const entry = entries[data.id];
        if (!entry) return;
        entry.name = name;

        clearSelection();
        renderAll();
        showToast("已重命名为 " + name);

      function shareSelected() {
        const selected = selectedEntryList();
        if (!selected.length) {
          showToast("请先选择要分享的项目");
          return;
        }
        showToast("已准备分享 " + selected.length + " 项");
      }
      function openPropertiesSheet() {
        const selected = selectedEntryList();
        if (selected.length === 1) {
          const entry = selected[0];
          const rows = [
            ["名称", entry.name],
            ["类型", entry.kind === "folder" ? "文件夹" : entry.kind === "archive" ? (entry.format || "压缩包") : "文件"],
            ["位置", state.dirPath.map((id) => dirs[id].name).join(" / ")]
          ];
          if (entry.kind === "folder") rows.push(["项目数", (entry.itemCount || folderItemCount(entry.childDir)) + " 项"]);
          else rows.push(["大小", formatBytes(entry.sizeBytes)]);
          rows.push(["修改日期", new Date(entry.modified).toLocaleString("zh-CN", { hour12: false })]);
          openInfo("属性", rows, entry.name);
          return;
        }
        const dir = dirs[currentDirId()];
        openInfo("当前目录", [
          ["路径", state.dirPath.map((id) => dirs[id].name).join(" / ")],
          ["项目数", ((dir && dir.entries) || []).length + " 项"],
          ["存储卷", volumes[state.volume].name]
        ], "文件夹");
      }
      function refreshCurrentFolder() {
        renderAll();
        showToast("已刷新当前目录");
      }

      function openInfo(title, rows, subtitle) {
        openSheet("info", { title, subtitle, rows: rows.map((row) => [row[0], row[1] || "—"]) });
      }
      function openArchiveInfo() {
        const archive = currentArchive();
        openInfo("压缩包信息", [
          ["名称", archive.name],
          ["格式", archive.format],
          ["压缩后大小", formatBytes(archive.sizeBytes)],
          ["解压后预计", formatBytes(archive.unpackedBytes)],
          ["文件数量", archive.totalItems + " 个"],
          ["加密", archive.encrypted ? "是" : "否"],
          ["修改日期", new Date(archive.modified).toLocaleString("zh-CN", { hour12: false })]
        ], "压缩包");
      }

      // Task drawer
      function taskCounts() {
        return {
          running: tasks.filter((task) => task.status === "running").length,
          waiting: tasks.filter((task) => task.status === "waiting" || task.status === "paused").length,
          completed: tasks.filter((task) => task.status === "completed").length
        };
      }
      function currentTask() {
        return tasks.find((task) => task.id === state.currentTaskId) || tasks.find((task) => task.status === "running") || tasks[0];
      }
      function taskStatusLabel(task) {
        return task.status === "running" ? "解压中" : task.status === "paused" ? "已暂停" : task.status === "waiting" ? "等待" : "已完成";
      }
      function renderTaskDrawer(rebuildQueue = true) {
        if (!state.drawerVisible) return;
        const current = currentTask();
        if (!current) return;
        const counts = taskCounts();
        document.getElementById("drawerSummary").textContent = counts.running + " 进行中 · " + counts.waiting + " 等待 · " + counts.completed + " 已完成";
        document.getElementById("currentTaskName").textContent = current.name;
        const stateEl = document.getElementById("currentTaskState");
        stateEl.className = "task-state " + current.status;
        stateEl.textContent = taskStatusLabel(current);
        const currentCard = document.getElementById("drawerCurrent");
        currentCard.classList.toggle("paused", current.status === "paused" || current.status === "waiting");
        currentCard.classList.toggle("completed", current.status === "completed");
        document.getElementById("currentTaskProgress").style.width = current.progress + "%";
        const remaining = current.status === "running" ? Math.max(1, Math.ceil((100 - current.progress) / 100 * current.duration / 1000)) : 0;
        document.getElementById("currentTaskLeft").textContent = current.status === "completed"
          ? "解压完成"
          : current.status === "waiting"
            ? "等待处理"
            : current.status === "paused"
              ? "已暂停"
              : current.speed + " · 剩余 " + remaining + " 秒";
        document.getElementById("currentTaskRight").textContent = current.status === "completed" ? current.completedTarget : current.target;
        const toggle = document.getElementById("currentTaskToggle");
        if (current.status === "completed") {
          toggle.className = "task-toggle complete";
          toggle.innerHTML = icon("i-check-circle");
          toggle.disabled = true;
        } else {
          toggle.className = "task-toggle";
          toggle.innerHTML = icon(current.status === "running" ? "i-pause" : "i-play");
          toggle.disabled = false;
          toggle.setAttribute("aria-label", current.status === "running" ? "暂停当前任务" : "继续当前任务");
        }
        document.getElementById("taskRunning").textContent = counts.running;
        document.getElementById("taskWaiting").textContent = counts.waiting;
        document.getElementById("taskComplete").textContent = counts.completed;
        if (rebuildQueue) renderQueueList();
        tasks.forEach((task) => {
          const row = document.querySelector('[data-task-row="' + task.id + '"]');
          if (!row) return;
          row.querySelector("[data-task-progress]").style.width = task.progress + "%";
          row.querySelector("[data-task-percent]").textContent = Math.round(task.progress) + "%";
          const status = row.querySelector("[data-task-status]");
          status.className = "task-state " + task.status;
          status.textContent = taskStatusLabel(task);
        });
        renderSettingsTaskSummary();
      }
      function renderQueueList() {
        const list = document.getElementById("queueList");
        list.innerHTML = tasks.map((task) => {
          const statusText = taskStatusLabel(task);
          const button = task.status === "completed"
            ? '<button class="task-toggle complete" type="button" disabled>' + icon("i-check-circle") + '</button>'
            : '<button class="task-toggle" type="button" data-task-toggle="' + task.id + '" aria-label="' + (task.status === "running" ? "暂停" : "继续") + ' ' + escapeHTML(task.name) + '">' + icon(task.status === "running" ? "i-pause" : "i-play") + '</button>';
          return '<div class="queue-row" data-task-row="' + task.id + '"><div class="queue-row-copy"><div class="queue-row-title"><strong>' + escapeHTML(task.name) + '</strong><span class="task-state ' + task.status + '" data-task-status>' + statusText + '</span></div>' +
            '<div class="linear-progress"><span data-task-progress style="width:' + task.progress + '%"></span></div><div class="queue-row-meta"><span data-task-percent>' + Math.round(task.progress) + '%</span><span>' + escapeHTML(task.target) + '</span></div></div>' + button + '</div>';
        }).join("");
      }
      function renderSettingsTaskSummary() {
        const counts = taskCounts();
        document.getElementById("settingsTaskSummary").textContent = counts.running + " 进行中 · " + counts.waiting + " 等待";
      }
      function openTaskDrawer(expanded) {
        state.drawerVisible = true;
        taskDrawer.hidden = false;
        if (!state.currentTaskId) state.currentTaskId = currentTask() ? currentTask().id : null;
        setDrawerExpanded(Boolean(expanded));
        browserView.classList.add("task-mode");
        renderTaskDrawer(true);
      }
      function closeTaskDrawer() {
        state.drawerVisible = false;
        taskDrawer.hidden = true;
        drawerScrim.hidden = true;
        drawerScrim.classList.remove("show");
        browserView.classList.remove("task-mode");
      }
      function setDrawerExpanded(expanded) {
        state.drawerExpanded = expanded;
        taskDrawer.classList.toggle("expanded", expanded);
        document.getElementById("drawerBody").hidden = !expanded;
        drawerScrim.hidden = !expanded;
        requestAnimationFrame(() => drawerScrim.classList.toggle("show", expanded));
        const toggle = document.getElementById("drawerExpand");
        toggle.setAttribute("aria-expanded", String(expanded));
        toggle.querySelector("use").setAttribute("href", expanded ? "#i-chevron-down" : "#i-chevron-up");
        if (expanded) renderTaskDrawer();
      }
      document.getElementById("drawerHandle").addEventListener("click", () => setDrawerExpanded(!state.drawerExpanded));
      document.getElementById("drawerExpand").addEventListener("click", () => setDrawerExpanded(!state.drawerExpanded));
      document.getElementById("drawerClose").addEventListener("click", closeTaskDrawer);
      drawerScrim.addEventListener("click", () => setDrawerExpanded(false));
      function toggleTask(id) {
        const task = tasks.find((item) => item.id === id);
        if (!task || task.status === "completed") return;
        if (task.status === "running") {
          task.status = "paused";
          showToast(task.name + " 已暂停");
        } else {
          task.status = "running";
          task.lastTick = performance.now();
          showToast(task.name + " 已继续");
        }
        renderTaskDrawer();
      }
      document.getElementById("currentTaskToggle").addEventListener("click", () => {
        const current = currentTask();
        if (current) toggleTask(current.id);
      });
      document.getElementById("queueList").addEventListener("click", (event) => {
        const button = event.target.closest("[data-task-toggle]");
        if (button) toggleTask(button.dataset.taskToggle);
      });

      function dirPathName(dirId) {
        const names = [];
        const seen = new Set();
        let cursor = dirId;
        while (cursor && dirs[cursor] && !seen.has(cursor)) {
          seen.add(cursor);
          names.unshift(dirs[cursor].name);
          cursor = dirs[cursor].parent;
        }
        return names.join(" / ");
      }
      function uniqueFolderName(parentDirId, baseName) {
        const names = new Set((dirs[parentDirId].entries || []).map((id) => entries[id]).filter(Boolean).map((entry) => entry.name));
        if (!names.has(baseName)) return baseName;
        let index = 2;
        while (names.has(baseName + " (" + index + ")")) index++;
        return baseName + " (" + index + ")";
      }
      function materializeExtraction(task) {
        if (task.materialized || !task.destinationParentId) return;
        const parent = dirs[task.destinationParentId];
        if (!parent) return;
        task.materialized = true;
        const name = uniqueFolderName(task.destinationParentId, task.folderName || "解压文件");
        const folderId = nextUid("folder");
        dirs[folderId] = { name, parent: task.destinationParentId, entries: [] };
        const folderEntryId = nextUid("entry");
        entries[folderEntryId] = { id: folderEntryId, kind: "folder", name, childDir: folderId, modified: Date.now() };
        parent.entries.unshift(folderEntryId);

        const imagesId = nextUid("folder");
        dirs[imagesId] = { name: "images", parent: folderId, entries: [] };
        const imagesEntryId = nextUid("entry");
        entries[imagesEntryId] = { id: imagesEntryId, kind: "folder", name: "images", childDir: imagesId, modified: Date.now() };
        dirs[folderId].entries.unshift(imagesEntryId);

        const readmeId = nextUid("entry");
        entries[readmeId] = { id: readmeId, kind: "file", name: "说明.txt", sizeBytes: 2048, ext: "txt", modified: Date.now() };
        dirs[folderId].entries.unshift(readmeId);

        task.completedTarget = dirPathName(task.destinationParentId) + " / " + name;
        const volume = volumes[task.volumeId || "internal"];
        if (volume) volume.used = Math.min(volume.total, volume.used + (task.unpackedBytes || 0) / 1e9);
        renderStorageMeter();
        renderAll();
      }

      setInterval(() => {
        const now = performance.now();
        let changed = false;
        let completedNow = false;
        const completedTasks = [];
        tasks.forEach((task) => {
          if (task.status !== "running") return;
          if (!task.lastTick) task.lastTick = now;
          const delta = Math.max(0, now - task.lastTick);
          task.lastTick = now;
          task.progress = Math.min(100, task.progress + (delta / task.duration) * 100);
          if (task.progress >= 100) {
            if (task.status !== "completed") completedNow = true;
            task.progress = 100;
            task.status = "completed";
            task.speed = "已完成";
            task.finishedAt = Date.now();
            completedTasks.push(task);
          }
          changed = true;
        });
        completedTasks.forEach(materializeExtraction);
        if (changed && state.drawerVisible) {
          renderTaskDrawer(completedNow);
          const active = currentTask();
          if (active && completedTasks.some((task) => task.id === active.id)) showToast(active.name + " 解压完成 · 已保存到 " + active.completedTarget);
        }
        if (changed) renderSettingsTaskSummary();
      }, 180);

      // Generic modal focus trap
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          if (folderPicker.classList.contains("open")) {
            if (pickerState.path.length > 1) {
              pickerState.path.pop();
              renderFolderPicker();
            } else {
              closeFolderPicker();
            }
            return;
          }
          if (!sheetLayer.hidden) { closeSheet(); return; }
          if (!sortMenu.hidden || !moreMenu.hidden) { closeMenus(); return; }
          if (!taskDrawer.hidden && state.drawerExpanded) { setDrawerExpanded(false); return; }
          if (settingsView.classList.contains("open")) { closeSettings(); return; }
          goBack();
          return;
        }
        if (event.key === "Tab" && !sheetLayer.hidden) {
          const focusables = Array.from(sheetContent.querySelectorAll("button:not([disabled]), input:not([disabled])")).filter((el) => !el.hidden);
          if (!focusables.length) return;
          const first = focusables[0];
          const last = focusables[focusables.length - 1];
          if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
          else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
        }
      });

      function setSystemTime() {
        document.getElementById("systemTime").textContent = new Intl.DateTimeFormat("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date());
      }

      setSystemTime();
      setInterval(setSystemTime, 30000);
      setTheme(settings.theme);
      renderSettings();
      renderAll();
    })();
  </script>
</body>
</html>

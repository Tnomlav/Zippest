    <rect x="23" y="448" width="17" height="20" rx="2" fill="none" stroke="#59625D" stroke-width="1.6"/>
    <path d="M27 455 H36 M27 460 H36 M27 465 H33" stroke="#59625D" stroke-width="1.4"/>

    <text x="68" y="280" font-size="12" fill="#59625D">54 项 · 10月17日</text>
    <path d="M360 256 l6 8 l-6 8" fill="none" stroke="#59625D" stroke-width="1.6"/>
    <line x1="12" y1="295.5" x2="381" y2="295.5" stroke="#7D8C82" stroke-opacity="0.32" stroke-width="1"/>

    <!-- 4 素材（归档对象，tertiary） -->
    <rect x="12" y="308" width="40" height="40" rx="12" fill="#D6E3EE"/>
    <rect x="22" y="320" width="20" height="16" rx="2" fill="none" stroke="#41586A" stroke-width="1.6"/>
    <path d="M22 325 H42" stroke="#41586A" stroke-width="1.6"/>

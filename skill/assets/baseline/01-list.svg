    <text x="68" y="472" font-size="12" fill="#59625D">12 KB · 10月12日</text>
    <path d="M360 448 l6 8 l-6 8" fill="none" stroke="#59625D" stroke-width="1.6"/>
    <line x1="12" y1="487.5" x2="381" y2="487.5" stroke="#7D8C82" stroke-opacity="0.32" stroke-width="1"/>

    <!-- 7-10 -->
    <rect x="12" y="500" width="40" height="40" rx="12" fill="#D9F2E7"/>
    <path d="M20 517 A1.5 1.5 0 0 1 21.5 515.5 h5 l2.5 2.5 h8.5 A1.5 1.5 0 0 1 39 519.5 v9 A1.5 1.5 0 0 1 37.5 530 h-16 A1.5 1.5 0 0 1 20 528.5 z" fill="none" stroke="#0F6B4F" stroke-width="1.6"/>
    <text x="68" y="518" font-size="14" font-weight="500" fill="#1B211E">年度精选</text>
    <text x="68" y="536" font-size="12" fill="#59625D">42 项 · 10月11日</text>
    <path d="M360 512 l6 8 l-6 8" fill="none" stroke="#59625D" stroke-width="1.6"/>
    <line x1="12" y1="551.5" x2="381" y2="551.5" stroke="#7D8C82" stroke-opacity="0.32" stroke-width="1"/>

    <rect x="12" y="564" width="40" height="40" rx="12" fill="#E9EFEA"/>
    <path d="M32 578 v12 M26 584 h12" stroke="#59625D" stroke-width="1.6"/>
    <text x="68" y="582" font-size="14" font-weight="500" fill="#1B211E">新建项目</text>
    <text x="68" y="600" font-size="12" fill="#59625D">空白 · 今天</text>
    <line x1="12" y1="615.5" x2="381" y2="615.5" stroke="#7D8C82" stroke-opacity="0.32" stroke-width="1"/>

    <rect x="12" y="628" width="40" height="40" rx="12" fill="#E9EFEA"/>
    <rect x="23" y="640" width="17" height="20" rx="2" fill="none" stroke="#59625D" stroke-width="1.6"/>
    <text x="68" y="646" font-size="14" font-weight="500" fill="#1B211E">备忘</text>
    <text x="68" y="664" font-size="12" fill="#59625D">3 项 · 10月9日</text>
    <path d="M360 640 l6 8 l-6 8" fill="none" stroke="#59625D" stroke-width="1.6"/>
    <line x1="12" y1="679.5" x2="381" y2="679.5" stroke="#7D8C82" stroke-opacity="0.32" stroke-width="1"/>

    <rect x="12" y="692" width="40" height="40" rx="12" fill="#DCE9E2"/>
    <circle cx="27" cy="707" r="2.4" fill="none" stroke="#4F6B5E" stroke-width="1.6"/>
    <path d="M20 720 L27 712 L33 718 L37 713 L40 716" fill="none" stroke="#4F6B5E" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="68" y="710" font-size="14" font-weight="500" fill="#1B211E">截图</text>
    <text x="68" y="728" font-size="12" fill="#59625D">64 项 · 10月8日</text>
    <path d="M360 704 l6 8 l-6 8" fill="none" stroke="#59625D" stroke-width="1.6"/>
  </g>

  <!-- bottom status bar -->
  <rect x="0" y="744" width="393" height="108" fill="#FFFFFF"/>
  <line x1="0" y1="744.5" x2="393" y2="744.5" stroke="#7D8C82" stroke-opacity="0.32" stroke-width="1"/>
  <g font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#59625D">
    <text x="12" y="772">本机存储 · 已用 436 GB / 491 GB</text>
    <text x="381" y="772" text-anchor="end">可用 55 GB</text>
  </g>
  <rect x="12" y="786" width="369" height="5" rx="2.5" fill="#E9EFEA"/>
  <rect x="12" y="786" width="325" height="5" rx="2.5" fill="#0F6B4F"/>
  <rect x="164" y="836" width="65" height="4" rx="2" fill="#1B211E" fill-opacity="0.28"/>
</svg>

    <text x="68" y="344" font-size="12" fill="#59625D">248.6 MB · 10月16日</text>
    <path d="M360 320 l6 8 l-6 8" fill="none" stroke="#59625D" stroke-width="1.6"/>
    <line x1="12" y1="359.5" x2="381" y2="359.5" stroke="#7D8C82" stroke-opacity="0.32" stroke-width="1"/>

    <!-- 5 封面（媒体，secondary） -->
    <rect x="12" y="372" width="40" height="40" rx="12" fill="#DCE9E2"/>
    <circle cx="27" cy="387" r="2.4" fill="none" stroke="#4F6B5E" stroke-width="1.6"/>
    <path d="M20 400 L27 392 L33 398 L37 393 L40 396" fill="none" stroke="#4F6B5E" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="68" y="390" font-size="14" font-weight="500" fill="#1B211E">封面</text>
    <text x="68" y="408" font-size="12" fill="#59625D">18 项 · 10月15日</text>
    <path d="M360 384 l6 8 l-6 8" fill="none" stroke="#59625D" stroke-width="1.6"/>
    <line x1="12" y1="423.5" x2="381" y2="423.5" stroke="#7D8C82" stroke-opacity="0.32" stroke-width="1"/>

    <!-- 6 文档（中性） -->

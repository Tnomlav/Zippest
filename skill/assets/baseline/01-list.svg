<svg xmlns="http://www.w3.org/2000/svg" width="393" height="852" viewBox="0 0 393 852" role="img" aria-labelledby="t d">
  <title id="t">Zippest 设计语言 · 列表页基准</title>
  <desc id="d">暖白底、64dp 扁平行、语义色方底图标、顶栏与页面同色、底部状态条。</desc>
  <rect width="393" height="852" fill="#F6F7F5"/>

  <!-- status bar -->
  <g fill="#1B211E" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12">
    <text x="24" y="28">9:41</text>
    <rect x="318" y="18" width="3" height="8" rx="1.5" fill="#1B211E"/>
    <rect x="324" y="15" width="3" height="11" rx="1.5" fill="#1B211E"/>
    <rect x="330" y="12" width="3" height="14" rx="1.5" fill="#1B211E"/>
    <rect x="344" y="15" width="20" height="10" rx="3" fill="none" stroke="#1B211E" stroke-width="1.2"/>
    <rect x="346" y="17" width="14" height="6" rx="1.5" fill="#1B211E"/>
  </g>

  <!-- top bar 64 -->
  <g fill="none" stroke="#1B211E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 65 L15 72 L22 79"/>
    <path d="M156 69 L161 74 L166 69"/>
    <circle cx="313" cy="70" r="6.5"/>
    <path d="M318 75 L323 80"/>
    <path d="M346 66 V78 M340 72 H352"/>
  </g>
  <g fill="#1B211E">
    <circle cx="374" cy="68" r="1.6"/><circle cx="374" cy="72" r="1.6"/><circle cx="374" cy="76" r="1.6"/>
  </g>
  <text x="56" y="79" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#1B211E">最近项目</text>

  <!-- list: 10 rows × 64 -->
  <g font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
    <!-- row template repeated; y = 104 + 64n -->
    <!-- 1 旅行 -->
    <rect x="12" y="116" width="40" height="40" rx="12" fill="#D9F2E7"/>
    <path d="M20 133 A1.5 1.5 0 0 1 21.5 131.5 h5 l2.5 2.5 h8.5 A1.5 1.5 0 0 1 39 135.5 v9 A1.5 1.5 0 0 1 37.5 146 h-16 A1.5 1.5 0 0 1 20 144.5 z" fill="none" stroke="#0F6B4F" stroke-width="1.6"/>
    <text x="68" y="134" font-size="14" font-weight="500" fill="#1B211E">旅行</text>
    <text x="68" y="152" font-size="12" fill="#59625D">128 项 · 昨天</text>
    <path d="M360 128 l6 8 l-6 8" fill="none" stroke="#59625D" stroke-width="1.6"/>
    <line x1="12" y1="167.5" x2="381" y2="167.5" stroke="#7D8C82" stroke-opacity="0.32" stroke-width="1"/>

    <!-- 2 家庭 -->
    <rect x="12" y="180" width="40" height="40" rx="12" fill="#D9F2E7"/>
    <path d="M20 197 A1.5 1.5 0 0 1 21.5 195.5 h5 l2.5 2.5 h8.5 A1.5 1.5 0 0 1 39 199.5 v9 A1.5 1.5 0 0 1 37.5 210 h-16 A1.5 1.5 0 0 1 20 208.5 z" fill="none" stroke="#0F6B4F" stroke-width="1.6"/>
    <text x="68" y="198" font-size="14" font-weight="500" fill="#1B211E">家庭</text>
    <text x="68" y="216" font-size="12" fill="#59625D">36 项 · 10月18日</text>
    <path d="M360 192 l6 8 l-6 8" fill="none" stroke="#59625D" stroke-width="1.6"/>
    <line x1="12" y1="231.5" x2="381" y2="231.5" stroke="#7D8C82" stroke-opacity="0.32" stroke-width="1"/>

    <!-- 3 工作 -->
    <rect x="12" y="244" width="40" height="40" rx="12" fill="#D9F2E7"/>
    <path d="M20 261 A1.5 1.5 0 0 1 21.5 259.5 h5 l2.5 2.5 h8.5 A1.5 1.5 0 0 1 39 263.5 v9 A1.5 1.5 0 0 1 37.5 274 h-16 A1.5 1.5 0 0 1 20 272.5 z" fill="none" stroke="#0F6B4F" stroke-width="1.6"/>
